<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="700" height="450">
  <defs>
    <linearGradient id="wall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <!-- Room Walls and Floor Perspective -->
  <polygon points="0,0 700,0 600,100 100,100" fill="#e2e8f0"/>
  <polygon points="0,0 100,100 100,350 0,450" fill="#f8fafc"/>
  <polygon points="700,0 700,450 600,350 600,100" fill="#e2e8f0"/>
  <rect x="100" y="100" width="500" height="250" fill="url(#wall)"/>
  <polygon points="0,450 100,350 600,350 700,450" fill="url(#floor)"/>

  <!-- Whiteboard / Smart Screen -->
  <rect x="220" y="125" width="260" height="120" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="4"/>
  <rect x="230" y="135" width="240" height="100" rx="3" fill="#10b981" opacity="0.2"/>
  <text x="350" y="180" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">Musholla Al-Qosos Kampus</text>
  <text x="350" y="202" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#93c5fd" text-anchor="middle">UNIBA MADURA</text>

  <!-- AC Unit -->
  <rect x="510" y="115" width="70" height="22" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="515" y1="130" x2="575" y2="130" stroke="#0284c7" stroke-width="2"/>

  <!-- Desks and Chairs -->
  <g transform="translate(130, 270)">
    <ellipse cx="80" cy="80" rx="55" ry="18" fill="#475569" opacity="0.8"/>
    <rect x="40" y="40" width="80" height="35" rx="5" fill="#64748b"/>
    <ellipse cx="220" cy="80" rx="55" ry="18" fill="#475569" opacity="0.8"/>
    <rect x="180" y="40" width="80" height="35" rx="5" fill="#64748b"/>
    <ellipse cx="360" cy="80" rx="55" ry="18" fill="#475569" opacity="0.8"/>
    <rect x="320" y="40" width="80" height="35" rx="5" fill="#64748b"/>
  </g>

  <!-- Info Badge -->
  <rect x="30" y="25" width="400" height="55" rx="8" fill="rgba(15,23,42,0.88)"/>
  <text x="45" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#ffffff">Musholla Al-Qosos Kampus</text>
  <text x="45" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#34d399">Tempat Ibadah Nyaman &amp; Tempat Wudhu</text>
</svg>