<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="unibaGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#064e3b" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Emblem Icon on Left -->
  <g transform="translate(10, 10)">
    <!-- Outer Gold Ring -->
    <circle cx="40" cy="40" r="39" fill="url(#goldGrad)" />
    <!-- Inner Green Circle -->
    <circle cx="40" cy="40" r="35" fill="url(#unibaGreenGrad)" />
    <!-- Decorative Dashed Inner Circle -->
    <circle cx="40" cy="40" r="32" fill="none" stroke="#fef3c7" stroke-width="1.2" stroke-dasharray="3,2" />
    
    <!-- Shield / Center White Crest -->
    <path d="M 40 18 Q 58 22 58 38 Q 58 56 40 64 Q 22 56 22 38 Q 22 22 40 18 Z" fill="#ffffff" filter="url(#softGlow)" />
    
    <!-- Torch / Mosque Minaret & Open Book motif inside -->
    <path d="M 40 24 L 44 32 L 36 32 Z" fill="#d97706" />
    <!-- Pillar / Dome -->
    <path d="M 37 32 H 43 V 45 H 37 Z" fill="#047857" />
    <!-- Base open book -->
    <path d="M 30 46 Q 40 43 40 48 Q 40 43 50 46 L 49 53 Q 40 50 40 54 Q 40 50 31 53 Z" fill="#065f46" />
    <!-- Gold Wings / Rice ear accents -->
    <path d="M 25 36 Q 28 32 34 35 Q 29 40 25 36 Z" fill="#f59e0b" />
    <path d="M 55 36 Q 52 32 46 35 Q 51 40 55 36 Z" fill="#f59e0b" />
    <path d="M 24 43 Q 29 40 33 44 Q 28 47 24 43 Z" fill="#f59e0b" />
    <path d="M 56 43 Q 51 40 47 44 Q 52 47 56 43 Z" fill="#f59e0b" />
    
    <!-- Five Point Star at top -->
    <polygon points="40,11 41.5,14.5 45,14.5 42,16.5 43.5,20 40,17.5 36.5,20 38,16.5 35,14.5 38.5,14.5" fill="#f59e0b" />
  </g>

  <!-- Typography Text on Right -->
  <g transform="translate(102, 22)">
    <!-- UNIBA MADURA Primary Title -->
    <text x="0" y="30" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', -apple-system, sans-serif" font-weight="800" font-size="28" fill="#064e3b" letter-spacing="1.5">
      UNIBA <tspan fill="#047857">MADURA</tspan>
    </text>
    <!-- Subtitle -->
    <text x="1" y="50" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', -apple-system, sans-serif" font-weight="600" font-size="12.5" fill="#475569" letter-spacing="0.3">
      Universitas Bahaudin Mudhary Madura
    </text>
    <!-- Tagline badge -->
    <rect x="1" y="58" width="138" height="15" rx="4" fill="#ecfdf5" />
    <text x="6" y="69.5" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', -apple-system, sans-serif" font-weight="600" font-size="8.5" fill="#047857" letter-spacing="0.8">
      CAMPUS SPATIAL GIS
    </text>
  </g>
</svg>
