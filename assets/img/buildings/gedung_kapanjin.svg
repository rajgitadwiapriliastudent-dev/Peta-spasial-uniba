<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <!-- Campus Ground -->
  <path d="M 0 380 Q 400 370 800 380 L 800 500 L 0 500 Z" fill="#e2e8f0"/>
  <rect x="0" y="410" width="800" height="90" fill="#cbd5e1"/>
  <line x1="0" y1="455" x2="800" y2="455" stroke="#94a3b8" stroke-width="4" stroke-dasharray="25,15"/>

  <!-- Modern Campus Building Structure -->
  <g transform="translate(150, 100)">
    <rect x="20" y="40" width="460" height="270" rx="8" fill="url(#bg)"/>
    <rect x="35" y="20" width="430" height="30" rx="4" fill="#1e293b"/>
    <!-- Glass Facade Window Rows -->
    <g fill="#bae6fd" opacity="0.85">
      <!-- Row 1 -->
      <rect x="45" y="70" width="75" height="45" rx="3"/>
      <rect x="135" y="70" width="75" height="45" rx="3"/>
      <rect x="225" y="70" width="75" height="45" rx="3"/>
      <rect x="315" y="70" width="75" height="45" rx="3"/>
      <rect x="405" y="70" width="55" height="45" rx="3"/>
      <!-- Row 2 -->
      <rect x="45" y="135" width="75" height="45" rx="3"/>
      <rect x="135" y="135" width="75" height="45" rx="3"/>
      <rect x="225" y="135" width="75" height="45" rx="3"/>
      <rect x="315" y="135" width="75" height="45" rx="3"/>
      <rect x="405" y="135" width="55" height="45" rx="3"/>
      <!-- Row 3 -->
      <rect x="45" y="200" width="75" height="45" rx="3"/>
      <rect x="135" y="200" width="75" height="45" rx="3"/>
      <rect x="225" y="200" width="75" height="45" rx="3"/>
      <rect x="315" y="200" width="75" height="45" rx="3"/>
      <rect x="405" y="200" width="55" height="45" rx="3"/>
    </g>
    <!-- Entrance Lobby -->
    <rect x="190" y="255" width="120" height="55" fill="#0f172a" rx="4"/>
    <rect x="205" y="270" width="40" height="40" fill="#7dd3fc" opacity="0.9"/>
    <rect x="255" y="270" width="40" height="40" fill="#7dd3fc" opacity="0.9"/>
    <!-- Canopy -->
    <polygon points="170,255 330,255 350,265 150,265" fill="#f59e0b"/>
  </g>

  <!-- Trees -->
  <circle cx="110" cy="370" r="35" fill="#10b981" opacity="0.9"/>
  <circle cx="130" cy="350" r="45" fill="#059669"/>
  <rect x="123" y="370" width="14" height="45" fill="#78350f"/>

  <circle cx="690" cy="370" r="35" fill="#10b981" opacity="0.9"/>
  <circle cx="670" cy="350" r="45" fill="#059669"/>
  <rect x="663" y="370" width="14" height="45" fill="#78350f"/>

  <!-- Info Overlay Card -->
  <rect x="40" y="30" width="450" height="65" rx="10" fill="rgba(255,255,255,0.92)"/>
  <text x="60" y="62" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#0f172a">Gedung Kapanjin</text>
  <text x="60" y="82" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#059669">Fakultas Ekonomi dan Bisnis (FEB)</text>
</svg>